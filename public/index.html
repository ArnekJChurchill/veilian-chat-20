<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Veilian — Full UI (Login / Chat / Profiles / Moderator)</title>
<style>
  :root{--bg:#f2f2f2;--card:#fff;--accent:#4a90e2;--danger:#d9534f;--muted:#777}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:#111}

  /* Centered login */
  .center-wrap{height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--card);padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(16,24,40,0.08);width:360px}
  h1{margin:0 0 12px;font-size:20px}
  input[type=text],input[type=password],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #d7d7d7;font-size:14px}
  .row{display:flex;gap:10px}
  button{padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  button.secondary{background:#eee;color:#111}
  .msg{min-height:22px;margin-top:8px;color:var(--danger);font-weight:600}

  /* App layout */
  .app{display:flex;height:100vh}
  .left{width:220px;background:#efefef;padding:18px;display:flex;flex-direction:column;gap:12px}
  .left .profile-small{display:flex;align-items:center;gap:10px;cursor:pointer}
  .left img.avatar-small{width:44px;height:44px;border-radius:50%;object-fit:cover}
  .left .username-small{font-weight:700}

  .main{flex:1;display:flex;flex-direction:column}
  .chat-display{flex:1;padding:20px;overflow:auto;background:linear-gradient(180deg,#fafafa,#fff)}
  .message{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
  .message .meta{font-size:12px;color:var(--muted)}
  .message.me{flex-direction:row-reverse}
  .message .bubble{max-width:70%;padding:10px 12px;border-radius:10px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.03)}
  .input-row{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}
  .input-row input{flex:1}

  /* Admin panel */
  .admin{width:240px;background:#fff;border-left:1px solid #eee;padding:18px}
  .admin h3{margin:0 0 10px}
  .admin .admin-buttons{display:flex;gap:8px}
  .admin button.warn{background:var(--danger)}

  /* Profile modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center}
  .modal .panel{width:420px;background:#fff;padding:20px;border-radius:12px;position:relative;text-align:center}
  .modal .panel .exit{position:absolute;right:12px;top:12px;border:0;background:transparent;cursor:pointer}
  .profile-avatar-large{width:120px;height:120px;border-radius:50%;object-fit:cover;cursor:pointer}
  .bio-section{margin-top:12px}
  textarea#bio{height:80px}
  .small{font-size:13px;color:var(--muted)}
  .hidden{display:none}

  /* Responsive tweaks */
  @media (max-width:900px){.admin{display:none}.left{display:none}}
</style>
</head>
<body>

<!-- LOGIN / SIGNUP SCREEN -->
<div id="loginScreen" class="center-wrap">
  <div class="card">
    <h1>Veilian Chat — Login / Sign up</h1>
    <label>Username (letters, numbers, hyphens only — no spaces or special chars)</label>
    <input id="usernameInput" type="text" placeholder="exampleuser" maxlength="32" />
    <label style="margin-top:8px">Password</label>
    <input id="passwordInput" type="password" placeholder="password" />

    <div class="row" style="margin-top:12px">
      <button id="loginBtn">Login</button>
      <button id="signupBtn" class="secondary">Sign Up</button>
    </div>

    <div id="loginMsg" class="msg" aria-live="polite"></div>
    <p class="small" style="margin-top:10px">Demo uses browser storage. In a real app, hook these actions to your server.</p>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="appRoot" class="app hidden" style="display:none">
  <div class="left">
    <div class="profile-small" id="profileBongle">
      <img class="avatar-small" id="leftAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'></svg>">
      <div>
        <div class="username-small" id="leftUsername">username</div>
        <div class="small" id="leftJoinDate">Joined: —</div>
      </div>
    </div>

    <div style="margin-top:8px">
      <strong>Active users</strong>
      <div id="userList" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>
    </div>

  </div>

  <div class="main">
    <div style="padding:12px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px">
      <strong id="roomTitle">ZE CHAT (normie)</strong>
      <div style="margin-left:auto;font-size:13px;color:var(--muted)">Status: <span id="statusDot">online</span></div>
    </div>

    <div id="chatDisplay" class="chat-display" role="log" aria-live="polite"></div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Enter message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="admin" id="adminPanel">
    <h3>Moderator Panel</h3>
    <label class="small">Manage user</label>
    <input id="adminUserInput" type="text" placeholder="username to ban/unban" />
    <div class="admin-buttons" style="margin-top:8px">
      <button id="unbanBtn" class="secondary">Unban</button>
      <button id="banBtn" class="warn">Ban</button>
    </div>
    <div style="margin-top:12px">
      <label class="small">Make moderator</label>
      <input id="modUserInput" type="text" placeholder="username to toggle mod" />
      <button id="toggleModBtn" style="margin-top:8px">Toggle Mod</button>
    </div>
  </div>
</div>

<!-- Profile modal (self-editable) -->
<div id="profileModal" class="modal">
  <div class="panel">
    <button class="exit" id="closeProfile">✕</button>
    <img id="profileAvatarLarge" class="profile-avatar-large" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'></svg>" title="Click to upload" />
    <h2 id="profileNameLarge">username</h2>

    <div class="bio-section">
      <label class="small">Bio</label>
      <textarea id="bio"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;justify-content:center">
        <button id="saveBioBtn">Save</button>
        <button id="cancelBioBtn" class="secondary">Cancel</button>
      </div>
    </div>

    <p class="small" style="margin-top:8px">Joined: <span id="profileJoinLarge">—</span></p>
    <input id="avatarFileInput" type="file" accept="image/*" class="hidden" />
  </div>
</div>

<!-- Other user's profile modal (read-only) -->
<div id="otherProfileModal" class="modal">
  <div class="panel">
    <button class="exit" id="closeOtherProfile">✕</button>
    <img id="otherAvatarLarge" class="profile-avatar-large" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'></svg>" />
    <h2 id="otherNameLarge">other user</h2>
    <div class="bio-section">
      <label class="small">Bio</label>
      <textarea id="otherBio" disabled></textarea>
    </div>
    <p class="small" style="margin-top:8px">Joined: <span id="otherJoinLarge">—</span></p>
  </div>
</div>

<!-- Include Pusher -->
<script src="https://js.pusher.com/8.2/pusher.min.js"></script>

<script>
// ---------------------------
// Pusher config
// ---------------------------
const PUSHER_KEY = "b7d05dcc13df522efbbc";
const PUSHER_CLUSTER = "us2";
const pusher = new Pusher(PUSHER_KEY, {
  cluster: PUSHER_CLUSTER,
  forceTLS: true
});
const channel = pusher.subscribe('veilian-chat');

// ---------------------------
// Your existing localStorage-based code starts here
// ---------------------------
// (Insert your full previous code here, then in key actions trigger Pusher events)
// ---------------------------

// Example: sending message triggers Pusher
function sendMessage(){
  const text = msgInput.value.trim(); if(!text) return;
  const banned = loadBanned(); if(banned.includes(CUR_USER.username)){alert('You are banned'); return;}
  const msgs = loadMessages();
  const m = {user:CUR_USER.username,text:text,t:new Date().toISOString(),avatar:CUR_USER.avatar||''};
  msgs.push(m); saveMessages(msgs);
  msgInput.value='';
  localStorage.setItem('veilian_sync','msg:'+Date.now());
  renderMessages();

  if(typeof channel.trigger==='function') channel.trigger('client-new-message', m);
}

// Similarly, trigger Pusher events for ban/unban, toggleMod, and profile update
</script>

</body>
</html>
