<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veilian Chat Nue</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
</head>
<body>
  <!-- LOGIN/SIGNUP -->
  <div id="loginScreen">
    <h1>Veilian Chat Nue</h1>
    <input id="usernameInput" placeholder="Username" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <div class="login-buttons">
      <button onclick="signup()">Sign Up</button>
      <button onclick="login()">Login</button>
    </div>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen" style="display:none;">
    <div class="chat-header">
      <div class="user-bongle" onclick="openProfile(currentUser.username)">
        <img id="userAvatar" src="/uploads/profilePics/default.png" alt="Avatar" />
        <span id="userDisplay"></span>
      </div>
      <div id="adminPanel" style="display:none;">
        <h3>Admin Panel</h3>
        <input id="banUserInput" placeholder="Username" />
        <button onclick="banUser()">Ban</button>
        <button onclick="unbanUser()">Unban</button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="chat-input">
      <input id="chatMessage" placeholder="Message..." />
      <button onclick="sendMessage()">Send</button>
      <button onclick="openProfile(currentUser.username)">Edit Profile</button>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profilePage" style="display:none;">
    <button id="closeProfileBtn" onclick="closeProfile()">X</button>
    <div class="profile-content">
      <img id="profileAvatar" src="/uploads/profilePics/default.png" alt="Avatar" onclick="uploadAvatar()" />
      <h2 id="profileUsername"></h2>
      <textarea id="profileBio" readonly></textarea>
      <div id="editButtons" style="display:none;">
        <button onclick="editBio()">Edit</button>
        <button id="saveBioBtn" onclick="saveBio()" style="display:none;">Save</button>
      </div>
      <p id="profileJoinDate"></p>
      <input type="file" id="avatarInput" style="display:none" onchange="submitAvatar(event)" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
